<script>
/* Encrypted copy: AES-GCM 256, key from the password via PBKDF2-SHA256. Without the password the content cannot be read. */
const P=JSON.parse(document.getElementById("payload").textContent);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const REM="lock-key-"+P.salt;
async function keyFromPw(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function openWith(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));let bytes=new Uint8Array(buf);
  if(P.gz)bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  const o=JSON.parse(new TextDecoder().decode(bytes));
  try{if(o.data&&!localStorage.getItem("sashin-dom-v1")){const d=o.data;localStorage.setItem("sashin-dom-v1",JSON.stringify({notes:d.notes||{},days:d.days||{},session:d.session||{done:{}},goals:d.goals||{checked:{},added:{},titles:{}},meta:d.meta||{labels:{},open:{},layout:{}},saved:Date.now()}))}}catch(e){}
  document.open();document.write(o.html);document.close();
}
const msg=t=>document.getElementById("msg").textContent=t;
if(!window.crypto||!crypto.subtle)msg("Этот браузер не умеет расшифровывать. Открой ссылку по https в Safari или Chrome.");
(async()=>{try{const r=localStorage.getItem(REM);if(r){const k=await crypto.subtle.importKey("raw",b64(r),"AES-GCM",false,["decrypt"]);await openWith(k)}}catch(e){try{localStorage.removeItem(REM)}catch(_){}}})();
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("go");b.disabled=true;msg("Открываю…");
  try{const k=await keyFromPw(document.getElementById("pw").value);const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));
    if(document.getElementById("rem").checked){try{localStorage.setItem(REM,toB64(raw))}catch(_){}}
    await openWith(k)}catch(err){msg("Неверный пароль");b.disabled=false}});
</script></body></html>
